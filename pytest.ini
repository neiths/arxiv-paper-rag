[pytest]
# Pytest configuration for arXiv Paper RAG tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio mode (auto or strict)
asyncio_mode = auto

# Test markers for categorizing tests
markers =
    asyncio: marks tests as async (deselect with '-m "not asyncio"')
    unit: unit tests that don't require external services
    integration: integration tests that may require external services
    api: API endpoint tests
    slow: marks tests as slow (deselect with '-m "not slow"')
    requires_arxiv: tests that interact with arXiv API (requires internet and rate limit handling)

# Minimum Python version
minversion = 8.0

# Test output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Test paths
testpaths = tests

# Timeout for pytest-timeout plugin (if installed)
timeout = 300

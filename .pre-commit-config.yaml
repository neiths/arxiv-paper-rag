# Ruff → linting, unused imports, unused variables, import sorting, many Flake8 rules (very fast)
# Black → formatting
# pyupgrade → automatically modernize Python syntax
# prettier → YAML, JSON, Markdown formatting (optional)
# check-yaml, end-of-file-fixer, trailing-whitespace → repository hygiene

repos:
  # ------------------------------------------------------------------
  # General file checks
  # ------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending

  # ------------------------------------------------------------------
  # Ruff (Lint + Import sorting + Auto-fix)
  # ------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.7
    hooks:
      - id: ruff
        args:
          - --fix
          - --exit-non-zero-on-fix

      - id: ruff-format

  # ------------------------------------------------------------------
  # Black
  # ------------------------------------------------------------------
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        language_version: python3

  # ------------------------------------------------------------------
  # Upgrade old Python syntax
  # ------------------------------------------------------------------
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.20.0
    hooks:
      - id: pyupgrade
        args: ["--py311-plus"]

  # ------------------------------------------------------------------
  # Markdown / YAML / JSON formatting
  # ------------------------------------------------------------------
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [yaml, json, markdown]
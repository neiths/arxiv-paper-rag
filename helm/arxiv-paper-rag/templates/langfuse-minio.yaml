{{- if .Values.langfuse.enabled -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "arxiv-paper-rag.fullname" . }}-langfuse-minio
  labels:
    {{- include "arxiv-paper-rag.labels" . | nindent 4 }}
    app.kubernetes.io/component: langfuse-minio
spec:
  serviceName: {{ include "arxiv-paper-rag.fullname" . }}-langfuse-minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: langfuse-minio
  template:
    metadata:
      labels:
        app.kubernetes.io/component: langfuse-minio
    spec:
      containers:
        - name: langfuse-minio
          image: "{{ .Values.langfuse.minio.image.repository }}:{{ .Values.langfuse.minio.image.tag }}"
          imagePullPolicy: {{ .Values.langfuse.minio.image.pullPolicy }}
          command:
            - sh
            - -c
            - 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "arxiv-paper-rag.fullname" . }}-secret
                  key: LANGFUSE_MINIO_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "arxiv-paper-rag.fullname" . }}-secret
                  key: LANGFUSE_MINIO_PASSWORD
          volumeMounts:
            - name: minio-data
              mountPath: /data
          readinessProbe:
            exec:
              command:
                - mc
                - ready
                - local
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - mc
                - ready
                - local
            initialDelaySeconds: 20
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: minio-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: {{ .Values.langfuse.minio.persistence.storageClass }}
        resources:
          requests:
            storage: {{ .Values.langfuse.minio.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "arxiv-paper-rag.fullname" . }}-langfuse-minio
  labels:
    {{- include "arxiv-paper-rag.labels" . | nindent 4 }}
    app.kubernetes.io/component: langfuse-minio
spec:
  type: ClusterIP
  ports:
    - port: 9000
      targetPort: 9000
      name: api
    - port: 9001
      targetPort: 9001
      name: console
  selector:
    app.kubernetes.io/component: langfuse-minio
{{- end }}

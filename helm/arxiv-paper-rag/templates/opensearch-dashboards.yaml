{{- if .Values.opensearchDashboards.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "arxiv-paper-rag.fullname" . }}-opensearch-dashboards
  labels:
    {{- include "arxiv-paper-rag.labels" . | nindent 4 }}
    app.kubernetes.io/component: opensearch-dashboards
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: opensearch-dashboards
  template:
    metadata:
      labels:
        app.kubernetes.io/component: opensearch-dashboards
    spec:
      containers:
        - name: opensearch-dashboards
          image: "{{ .Values.opensearchDashboards.image.repository }}:{{ .Values.opensearchDashboards.image.tag }}"
          imagePullPolicy: {{ .Values.opensearchDashboards.image.pullPolicy }}
          ports:
            - containerPort: 5601
              name: http
          env:
            - name: OPENSEARCH_HOSTS
              value: "http://{{ include "arxiv-paper-rag.fullname" . }}-opensearch:9200"
            - name: DISABLE_SECURITY_DASHBOARDS_PLUGIN
              value: "true"
          readinessProbe:
            httpGet:
              path: /api/status
              port: 5601
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/status
              port: 5601
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "arxiv-paper-rag.fullname" . }}-opensearch-dashboards
  labels:
    {{- include "arxiv-paper-rag.labels" . | nindent 4 }}
    app.kubernetes.io/component: opensearch-dashboards
spec:
  type: {{ .Values.opensearchDashboards.service.type }}
  ports:
    - port: {{ .Values.opensearchDashboards.service.port }}
      targetPort: 5601
      name: http
  selector:
    app.kubernetes.io/component: opensearch-dashboards
{{- end }}

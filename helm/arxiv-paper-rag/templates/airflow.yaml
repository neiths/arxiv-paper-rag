{{- if .Values.airflow.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "arxiv-paper-rag.fullname" . }}-airflow
  labels:
    {{- include "arxiv-paper-rag.labels" . | nindent 4 }}
    app.kubernetes.io/component: airflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: airflow
  template:
    metadata:
      labels:
        app.kubernetes.io/component: airflow
    spec:
      containers:
        - name: airflow
          image: "{{ .Values.airflow.image.repository }}:{{ .Values.airflow.image.tag }}"
          imagePullPolicy: {{ .Values.airflow.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "arxiv-paper-rag.fullname" . }}-config
            - secretRef:
                name: {{ include "arxiv-paper-rag.fullname" . }}-secret
          env:
            - name: PYTHONPATH
              value: "/opt/airflow"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "arxiv-paper-rag.fullname" . }}-airflow
  labels:
    {{- include "arxiv-paper-rag.labels" . | nindent 4 }}
    app.kubernetes.io/component: airflow
spec:
  type: {{ .Values.airflow.service.type }}
  ports:
    - port: {{ .Values.airflow.service.port }}
      targetPort: 8080
      name: http
  selector:
    app.kubernetes.io/component: airflow
{{- end }}

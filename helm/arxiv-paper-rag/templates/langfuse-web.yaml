{{- if .Values.langfuse.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "arxiv-paper-rag.fullname" . }}-langfuse-web
  labels:
    {{- include "arxiv-paper-rag.labels" . | nindent 4 }}
    app.kubernetes.io/component: langfuse-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: langfuse-web
  template:
    metadata:
      labels:
        app.kubernetes.io/component: langfuse-web
    spec:
      containers:
        - name: langfuse-web
          image: "{{ .Values.langfuse.web.image.repository }}:{{ .Values.langfuse.web.image.tag }}"
          imagePullPolicy: {{ .Values.langfuse.web.image.pullPolicy }}
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NEXTAUTH_URL
              value: "http://localhost:3001"
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "arxiv-paper-rag.fullname" . }}-secret
                  key: LANGFUSE_NEXTAUTH_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "arxiv-paper-rag.fullname" . }}-secret
                  key: LANGFUSE_DATABASE_URL
            - name: SALT
              valueFrom:
                secretKeyRef:
                  name: {{ include "arxiv-paper-rag.fullname" . }}-secret
                  key: LANGFUSE_SALT
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "arxiv-paper-rag.fullname" . }}-secret
                  key: LANGFUSE_ENCRYPTION_KEY
            - name: TELEMETRY_ENABLED
              value: "false"
            - name: LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES
              value: "true"
            - name: CLICKHOUSE_MIGRATION_URL
              value: "clickhouse://{{ include "arxiv-paper-rag.fullname" . }}-clickhouse:9000"
            - name: CLICKHOUSE_URL
              value: "http://{{ include "arxiv-paper-rag.fullname" . }}-clickhouse:8123"
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "arxiv-paper-rag.fullname" . }}-secret
                  key: CLICKHOUSE_USER
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "arxiv-paper-rag.fullname" . }}-secret
                  key: CLICKHOUSE_PASSWORD
            - name: CLICKHOUSE_CLUSTER_ENABLED
              value: "false"
            - name: LANGFUSE_USE_AZURE_BLOB
              value: "false"
            - name: LANGFUSE_S3_EVENT_UPLOAD_BUCKET
              value: "langfuse"
            - name: LANGFUSE_S3_EVENT_UPLOAD_REGION
              value: "auto"
            - name: LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "arxiv-paper-rag.fullname" . }}-secret
                  key: LANGFUSE_MINIO_USER
            - name: LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "arxiv-paper-rag.fullname" . }}-secret
                  key: LANGFUSE_MINIO_PASSWORD
            - name: LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT
              value: "http://{{ include "arxiv-paper-rag.fullname" . }}-langfuse-minio:9000"
            - name: LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE
              value: "true"
            - name: LANGFUSE_S3_EVENT_UPLOAD_PREFIX
              value: "events/"
            - name: LANGFUSE_S3_MEDIA_UPLOAD_BUCKET
              value: "langfuse"
            - name: LANGFUSE_S3_MEDIA_UPLOAD_REGION
              value: "auto"
            - name: LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "arxiv-paper-rag.fullname" . }}-secret
                  key: LANGFUSE_MINIO_USER
            - name: LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "arxiv-paper-rag.fullname" . }}-secret
                  key: LANGFUSE_MINIO_PASSWORD
            - name: LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT
              value: "http://{{ include "arxiv-paper-rag.fullname" . }}-langfuse-minio:9000"
            - name: LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE
              value: "true"
            - name: LANGFUSE_S3_MEDIA_UPLOAD_PREFIX
              value: "media/"
            - name: REDIS_HOST
              value: "{{ include "arxiv-paper-rag.fullname" . }}-langfuse-redis"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ include "arxiv-paper-rag.fullname" . }}-secret
                  key: LANGFUSE_REDIS_PASSWORD
            - name: REDIS_TLS_ENABLED
              value: "false"
            - name: LANGFUSE_INIT_ORG_ID
              value: "default-org"
            - name: LANGFUSE_INIT_ORG_NAME
              value: "RAG Organization"
            - name: LANGFUSE_INIT_PROJECT_NAME
              value: "Agentic RAG"
            - name: LANGFUSE_INIT_USER_EMAIL
              value: "admin@example.com"
            - name: LANGFUSE_INIT_USER_NAME
              value: "Admin User"
            - name: LANGFUSE_INIT_USER_PASSWORD
              value: "admin123"
          readinessProbe:
            httpGet:
              path: /api/public/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/public/health
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "arxiv-paper-rag.fullname" . }}-langfuse-web
  labels:
    {{- include "arxiv-paper-rag.labels" . | nindent 4 }}
    app.kubernetes.io/component: langfuse-web
spec:
  type: {{ .Values.langfuse.web.service.type }}
  ports:
    - port: {{ .Values.langfuse.web.service.port }}
      targetPort: 3000
      name: http
  selector:
    app.kubernetes.io/component: langfuse-web
{{- end }}
